name: H2H Snapshot – Startseite

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: h2h-snapshot-startseite
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: H2H-Snapshot aktualisieren
        run: node scripts/h2h-snapshot.mjs

      - name: Änderungen prüfen
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- h2h-spieldaten.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine H2H-Datenänderung."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- h2h-spieldaten.json
          fi

      - name: Snapshot committen
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add h2h-spieldaten.json
          git commit -m "H2H: Startseiten-Snapshot aktualisieren"
          git push
