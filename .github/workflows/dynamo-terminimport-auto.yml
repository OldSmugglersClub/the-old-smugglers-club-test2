name: Dynamo Termine – automatisch

on:
  workflow_dispatch:
  schedule:
    # Viermal täglich. Die Fachlogik schreibt nur bei neuen, sicher konkretisierbaren Terminen.
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  # Absichtlich dieselbe Gruppe wie Phase 6A, damit niemals zwei Automatismen
  # gleichzeitig spieldaten.json verändern.
  group: osc-bundesliga-ergebnisimport
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Dynamo-Termine aus OpenLigaDB prüfen
        run: node scripts/dynamo-terminimport-auto.mjs

      - name: Änderungen prüfen
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- spieldaten.json schedule-terminstand.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Keine Änderung an spieldaten.json oder schedule-terminstand.json – kein Commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Neue bestätigte Dynamo-Termine oder Persistenzänderungen liegen vor."
          fi

      - name: Neue Dynamo-Termine committen
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spieldaten.json schedule-terminstand.json
          git commit -m "Dynamo-Termine automatisch aktualisiert"
          git push
